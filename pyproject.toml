[project]
name = "property-rental"
version = "0.1.0"
description = "Django and React rental-property operations and investment analytics app."
requires-python = ">=3.11"
dependencies = [
    "appdirs==1.4.4",
    "asgiref==3.7.2",
    "beautifulsoup4==4.12.2",
    "certifi==2025.11.12",
    "charset-normalizer==3.3.0",
    "click==8.4.2",
    "colorama==0.4.6",
    "cssbeautifier==2.0.3",
    "django==4.2.4",
    "django-vite==3.1.0",
    "djangorestframework==3.14.0",
    "djlint==1.43.1",
    "editorconfig==0.17.1",
    "frozendict==2.3.8",
    "html-tag-names==0.1.2",
    "html-void-elements==0.1.0",
    "html5lib==1.1",
    "idna==3.4",
    "jsbeautifier==2.0.3",
    "json5==0.15.0",
    "lxml==6.1.1",
    "multitasking==0.0.11",
    "networkx==3.1",
    "pathspec==1.1.1",
    "psycopg[binary]>=3.1",
    "python-dateutil>=2.9.0.post0",
    "pytz>=2025.2",
    "pyyaml==6.0.3",
    "regex==2026.7.19",
    "requests==2.31.0",
    "six==1.16.0",
    "soupsieve==2.5",
    "sqlparse==0.4.4",
    "tomli==2.0.1",
    "tqdm==4.66.1",
    "typing-extensions==4.8.0",
    "tzdata==2023.3",
    "urllib3==2.0.6",
    "webencodings==0.5.1",
    "whitenoise==6.5.0",
    "yfinance==0.2.66",
]

[dependency-groups]
dev = [
    "coverage>=7.3",
    "factory-boy>=3.3",
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "pytest-django>=4.7",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "property_rental.settings.dev"
python_files = ["tests.py", "test_*.py", "*_tests.py"]
pythonpath = ["property_rental"]
